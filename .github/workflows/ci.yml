# M2: contract lint + unit tests (shared, sdk, gateway critical paths)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (lint contract)
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build packages
        run: pnpm --filter @softqraft/shared build && pnpm --filter @softqraft/sdk build && pnpm --filter @softqraft/gateway-api build
