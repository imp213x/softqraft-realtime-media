# SoftQraft Realtime Media — LiveKit (local Docker Desktop friendly)
# Rotate keys before any shared or production environment.
#
# PC connection failures on local Docker usually mean the server advertised a
# container IP (e.g. 172.19.x.x). For browser-on-same-machine, force node_ip
# to 127.0.0.1 and publish the media ports below.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  # Single UDP port is far more reliable through Docker Desktop NAT than a range
  udp_port: 7882
  # Advertise loopback so the host browser can ICE to published ports
  use_external_ip: false
  node_ip: 127.0.0.1
  # Prefer STUN only when you set a real public/LAN node_ip for remote clients
  # stun_servers: []

redis:
  address: redis:6379

keys:
  softqraft_dev_key: softqraft_dev_secret_change_me_before_prod

logging:
  level: info

webhook:
  api_key: softqraft_dev_key
  urls:
    - http://gateway:8080/v1/webhooks/livekit

turn:
  enabled: false
