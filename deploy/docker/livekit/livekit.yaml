# Development LiveKit config — replace keys before any shared environment.
# Generate keys: docker run --rm livekit/livekit-server generate-keys

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # For local browser testing on the same machine, use_external_ip can be false.
  # For remote clients, set true or set node_ip to your public address.
  use_external_ip: false

redis:
  address: redis:6379

# DEV ONLY — rotate before staging/production
keys:
  devkey: secret_replace_me_with_generate_keys_output

logging:
  level: info
