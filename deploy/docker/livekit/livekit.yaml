# SoftQraft Realtime Media — LiveKit (local Docker)
# node_ip MUST be reachable from BOTH:
#   1) browser on the host
#   2) egress container (room composite Chrome)
# 127.0.0.1 works for the browser but breaks Egress (its own loopback).
# Prefer your LAN IP (e.g. 192.168.x.x). Regenerate with:
#   powershell -File scripts/sync-livekit-node-ip.ps1

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # UPDATED BY scripts/sync-livekit-node-ip.ps1 — do not use 127.0.0.1 if testing Echo
  node_ip: 192.168.1.131

redis:
  address: redis:6379

keys:
  softqraft_dev_key: softqraft_dev_secret_change_me_before_prod

logging:
  level: info

webhook:
  api_key: softqraft_dev_key
  urls:
    - http://gateway:8080/v1/webhooks/livekit

# TURN: use external coturn (deploy/compose profile turn | turn-bridge | full).
# LiveKit embedded TURN is DISABLED so port 3478 is free for coturn (ADR-008).
# Clients receive iceServers from Gateway token responses (TURN_* env).
# See docs/operations/turn-hls-cdn.md
turn:
  enabled: false
