# SoftQraft Realtime Media — LiveKit Egress worker
# Room composite file output (Echo-style MP4). Storage via env-driven S3 in requests
# and/or defaults below for local MinIO.
#
# Keys must match livekit.yaml

log_level: info
api_key: softqraft_dev_key
api_secret: softqraft_dev_secret_change_me_before_prod
ws_url: ws://livekit:7880

redis:
  address: redis:6379

# Health / CPU limits can be tuned in production
# cpu_cost:
#   room_composite_cpu_cost: 3.0
