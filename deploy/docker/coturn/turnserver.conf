# SoftQraft Realtime Media — coturn (local / single-node)
# Credentials and external IP are injected via docker-compose command line
# for easier env substitution. This file holds stable defaults.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=softqraft.local
# user/password set via -u in compose
# external-ip set via --external-ip in compose when known

# Relay ports (published in compose)
min-port=49160
max-port=49200

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Verbose for local debug; reduce in production
verbose
