# SoftQraft Realtime Media — local / single-node media plane
#
# Usage:
#   cd deploy/compose
#   copy ..\env\media.env.example .env   # PowerShell: Copy-Item
#   docker compose up -d
#
# Stack: Redis + LiveKit + coturn TURN + Egress + MinIO + Gateway
# Market-grade layers: TURN (coturn), HLS (Egress), multi-tenant Gateway, CDN templates.
# Production Echo: AWS S3 (ADR-006); MinIO is local-only.

name: softqraft-realtime-media

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Durable sessions / egress / idempotency (hardening #3)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softqraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softqraft}
      POSTGRES_DB: ${POSTGRES_DB:-softqraft_gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softqraft} -d ${POSTGRES_DB:-softqraft_gateway}"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    # Clatters livekit-client 2.19 expects /rtc/v1 (protocol 17).
    # Pin a Docker Hub–published patch (v1.13.5 was not consistently published).
    # CI: .github/workflows/compose-images.yml
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      # Single media UDP port (must match livekit.yaml rtc.udp_port)
      - "7882:7882/udp"

  # NAT traversal for mobile / restrictive networks (ADR-008)
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    # host network: ports 3478/udp+tcp, 5349, 49160-49200 on the machine
    # On Docker Desktop Windows, host network is limited — see docs/operations/turn-hls-cdn.md
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM:-softqraft.local}"
      - "--user=${TURN_USERNAME:-softqraft}:${TURN_PASSWORD:-softqraftturn}"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-multicast-peers"
      - "--no-cli"
    profiles:
      - turn
      - full

  # Bridge profile for platforms where network_mode:host is weak (Docker Desktop)
  coturn-bridge:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM:-softqraft.local}"
      - "--user=${TURN_USERNAME:-softqraft}:${TURN_PASSWORD:-softqraftturn}"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-multicast-peers"
      - "--no-cli"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    profiles:
      - turn-bridge

  # Local S3-compatible storage for recording smoke tests.
  # Production Echo stays on AWS S3 (set GATEWAY / egress request credentials).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-softqraft}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-softqraftsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Create default recording bucket; public-read for local HLS players (lab only)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-softqraft} $${MINIO_ROOT_PASSWORD:-softqraftsecret};
      BUCKET=$${S3_BUCKET_NAME:-sqrm-recordings};
      mc mb -p local/$$BUCKET || true;
      # Lab-only: allow anonymous GET so browser hls.js can fetch playlists/segments
      mc anonymous set download local/$$BUCKET || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-softqraft}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-softqraftsecret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sqrm-recordings}

  egress:
    image: livekit/egress:v1.9.1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio-init:
        condition: service_started
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ../docker/egress/egress.yaml:/etc/egress.yaml:ro
    # Room composite uses Chromium
    shm_size: "2gb"
    # Reach host-published LiveKit media ports when node_ip is the LAN IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Gateway: do NOT run pnpm inside Docker (GCP often fails DNS to registry.npmjs.org).
  # Build on the host first:
  #   ./deploy/scripts/build-gateway-host.sh
  # That fills deploy/docker/gateway/out and tags softqraft-realtime-media-gateway:prebuilt
  gateway:
    image: softqraft-realtime-media-gateway:prebuilt
    build:
      context: ../docker/gateway
      dockerfile: Dockerfile.prebuilt
      # packaging only — no network / no pnpm
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Values from deploy/compose/.env (env_file) unless overridden below.
      # Docker-internal service names MUST win over host-oriented .env values.
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      GATEWAY_SERVICE_API_KEYS: ${GATEWAY_SERVICE_API_KEYS:-dev-local-key}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_TENANTS: ${GATEWAY_TENANTS:-}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-}
      # Always in-cluster LiveKit HTTP (do not use public IP / localhost here)
      LIVEKIT_URL: http://livekit:7880
      # Browser-facing WSS (set in .env to wss://realtime.softqraftlabs.com)
      LIVEKIT_REALTIME_URL: ${LIVEKIT_REALTIME_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-softqraft_dev_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-softqraft_dev_secret_change_me_before_prod}
      # Always in-cluster Redis (ignore REDIS_URL=localhost from host-oriented .env)
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:-postgres://softqraft:softqraft@postgres:5432/softqraft_gateway}
      QUOTA_BACKEND: ${QUOTA_BACKEND:-redis}
      TENANT_STORE_PATH: ${TENANT_STORE_PATH:-/data/tenants.json}
      USAGE_STORE_PATH: ${USAGE_STORE_PATH:-/data/usage.json}
      # S3/R2 — allow .env to override MinIO defaults (was hardcoded minio; broke R2)
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sqrm-recordings}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-softqraft}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-softqraftsecret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RECORDING_KEY_TEMPLATE: ${RECORDING_KEY_TEMPLATE:-recordings/{externalId}/{sessionId}-{time}.mp4}
      HLS_KEY_TEMPLATE: ${HLS_KEY_TEMPLATE:-hls/{externalId}/{sessionId}}
      HLS_PUBLIC_BASE_URL: ${HLS_PUBLIC_BASE_URL:-http://localhost:9000/sqrm-recordings}
      CDN_PUBLIC_BASE_URL: ${CDN_PUBLIC_BASE_URL:-}
      TURN_ENABLED: ${TURN_ENABLED:-true}
      TURN_HOST: ${TURN_HOST:-127.0.0.1}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_USERNAME: ${TURN_USERNAME:-softqraft}
      TURN_PASSWORD: ${TURN_PASSWORD:-softqraftturn}
      TURN_URLS: ${TURN_URLS:-}
      WEBHOOK_FORWARD_URLS: ${WEBHOOK_FORWARD_URLS:-}
      DEPLOYMENT_PLANE: ${DEPLOYMENT_PLANE:-demo}
      HOSTING_COST_CLASS: ${HOSTING_COST_CLASS:-hyperscaler_list_egress}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-600}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
    volumes:
      - gateway_data:/data
    ports:
      - "8080:8080"

volumes:
  minio_data:
  postgres_data:
  gateway_data:
